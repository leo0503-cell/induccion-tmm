<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#062f4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inducción TMM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<title>Inducción TMM</title>
<meta name="description" content="Curso de inducción interactivo para el equipo de Triplay y Maderas de Mayoreo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,700;1,700;1,800;1,900&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: una "ruta" de módulos bajo una banda azul hondo con el triángulo de marca sangrando;
   cada lección se abre como un reproductor de pantallas a pantalla completa. El avance se ve
   como una estiba de triplay que crece una hoja por módulo. */
:root {
  --azul: #0079c1;
  --azul-hondo: #062f4d;
  --verde: #00d200;
  --verde-ok: #1e8e3e;
  --palido: #e1fae1;
  --fondo: #f2f6f8;
  --sup: #ffffff;
  --sup-2: #e9f0f4;
  --tinta: #10202c;
  --tenue: #566876;
  --linea: #d3dee5;
  --malo: #c2412d;
  --malo-suave: #fbe6e1;
  --ok-suave: #e3f6e7;
  --sel: #d6ecfa;
  --sombra: 0 1px 2px rgba(6, 47, 77, .08), 0 8px 24px rgba(6, 47, 77, .08);
  --display: "Exo 2", "Montserrat", "Segoe UI", system-ui, sans-serif;
  --texto: "Montserrat", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --azul: #3ea4e6; --azul-hondo: #05243b; --verde-ok: #43c06a; --palido: #12351f;
    --fondo: #0a1621; --sup: #112333; --sup-2: #18304380; --tinta: #e5eef4; --tenue: #94a9b8;
    --linea: #23394b; --malo: #f07862; --malo-suave: #3b1b16; --ok-suave: #143322; --sel: #123a57;
    --sombra: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --azul: #3ea4e6; --azul-hondo: #05243b; --verde-ok: #43c06a; --palido: #12351f;
  --fondo: #0a1621; --sup: #112333; --sup-2: #18304380; --tinta: #e5eef4; --tenue: #94a9b8;
  --linea: #23394b; --malo: #f07862; --malo-suave: #3b1b16; --ok-suave: #143322; --sel: #123a57;
  --sombra: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--fondo); color: var(--tinta); font-family: var(--texto); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--display); font-style: italic; font-weight: 800; line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }
img { display: block; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--tenue); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Botones ---------- */
.btn { border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 700; background: var(--azul); color: #fff; display: inline-flex; align-items: center; gap: 8px; transition: transform .15s, filter .15s, opacity .15s; }
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: scale(.97); }
.btn[disabled] { opacity: .38; cursor: not-allowed; filter: none; transform: none; }
.btn.sec { background: transparent; color: var(--tinta); box-shadow: inset 0 0 0 1.5px var(--linea); }
.btn.verde { background: var(--verde-ok); }
.btn.blanco { background: #fff; color: #062f4d; }
.btn svg { width: 18px; height: 18px; }

/* ---------- Banda superior (siempre azul hondo) ---------- */
.banda { position: relative; overflow: hidden; background: var(--azul-hondo); color: #eaf4fb; }
.banda::before { content: ""; position: absolute; left: -160px; bottom: -40px; width: 520px; height: 450px; background: #00d200; opacity: .09; clip-path: polygon(50% 0, 100% 100%, 0 100%); pointer-events: none; }
.banda-in { position: relative; max-width: 1080px; margin: 0 auto; padding: 18px 16px 28px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; }
.topline { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.topline img { height: 34px; width: auto; }
.pt { display: inline-flex; align-items: baseline; gap: 6px; background: rgba(255,255,255,.1); border-radius: 999px; padding: 6px 14px; font-weight: 700; }
.pt small { font-weight: 500; opacity: .75; font-size: 11px; }
.saludo h1 { font-size: clamp(28px, 5vw, 46px); color: #fff; }
.saludo h1 em { color: #7fe07f; font-style: italic; }
.saludo p { margin-top: 10px; max-width: 52ch; color: #bcd3e3; }
.saludo .acciones { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.barra-total { margin-top: 18px; max-width: 420px; }
.barra-total .fila { display: flex; justify-content: space-between; font-size: 12.5px; color: #bcd3e3; margin-bottom: 6px; }
.riel { height: 8px; background: rgba(255,255,255,.12); border-radius: 99px; overflow: hidden; }
.riel i { display: block; height: 100%; background: linear-gradient(90deg, #00d200, #7fe07f); border-radius: 99px; transition: width .8s cubic-bezier(.2,.8,.2,1); }
.estiba-caja { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.estiba-caja .eyebrow { color: #8fb3cb; }
.estiba { width: 230px; max-width: 100%; height: auto; overflow: visible; }
.hoja-nueva { animation: cae .9s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes cae { from { transform: translateY(-120px); opacity: 0; } 60% { opacity: 1; } to { transform: none; } }

/* Alta */
.alta { margin-top: 18px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; max-width: 520px; }
.alta label { font-size: 12.5px; font-weight: 600; color: #bcd3e3; display: grid; gap: 6px; }
.alta input, .alta select { font: inherit; padding: 11px 13px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.2); color: #fff; }
.alta select option { color: #10202c; }
.nota-instalar { flex-basis: 100%; font-size: 13px; color: #bcd3e3; }
.alta .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ---------- Ruta ---------- */
main { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: grid; gap: 40px; }
.sec-tit { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.sec-tit h2 { font-size: 26px; }
.ruta { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.mod { position: relative; display: grid; grid-template-columns: 96px minmax(0, 1fr); background: var(--sup); border-radius: var(--r); overflow: hidden; box-shadow: var(--sombra); border: 0; padding: 0; text-align: left; transition: transform .2s, box-shadow .2s; }
.mod:hover { transform: translateY(-2px); }
.mod .foto { position: relative; background: var(--sup-2) center/cover no-repeat; min-height: 128px; }
.mod .foto b { position: absolute; left: 8px; top: 8px; font-family: var(--display); font-style: italic; font-weight: 900; font-size: 22px; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
.mod .info { padding: 12px 14px 12px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.etiqueta { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--tenue); display: flex; gap: 8px; flex-wrap: wrap; }
.mod h3 { font-size: 18.5px; }
.mod .sub { font-size: 13px; color: var(--tenue); }
.estado { margin-top: 6px; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; }
.pill { border-radius: 99px; padding: 3px 10px; font-size: 11.5px; font-weight: 700; background: var(--sup-2); color: var(--tenue); }
.pill.ok { background: var(--ok-suave); color: var(--verde-ok); }
.pill.curso { background: var(--sel); color: var(--azul); }
.mini-riel { flex: 1; height: 5px; background: var(--sup-2); border-radius: 9px; overflow: hidden; }
.mini-riel i { display: block; height: 100%; background: var(--azul); }
.mod.hecho .mini-riel i { background: var(--verde-ok); }
.mod .sello { position: absolute; right: 10px; top: 10px; width: 26px; height: 26px; }

.final { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.tarjeta-final { background: var(--sup); border-radius: var(--r); box-shadow: var(--sombra); padding: 20px; display: grid; gap: 10px; align-content: start; position: relative; overflow: hidden; }
.tarjeta-final h3 { font-size: 22px; }
.tarjeta-final p { color: var(--tenue); }
.tarjeta-final .btn { justify-self: start; }
.tarjeta-final .rino-esq { position: absolute; right: -6px; bottom: -8px; width: 92px; opacity: .95; }
.candado { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--tenue); font-weight: 600; }

/* Equipo */
.equipo { background: var(--sup); border-radius: var(--r); box-shadow: var(--sombra); overflow: hidden; }
.equipo table { width: 100%; border-collapse: collapse; font-size: 14px; }
.equipo th, .equipo td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--linea); }
.equipo th { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--tenue); font-weight: 700; }
.equipo td.n { text-align: right; font-variant-numeric: tabular-nums; }
.equipo tr.yo td { background: var(--sel); }
.equipo .vacio { padding: 22px; color: var(--tenue); }
.scroll-x { overflow-x: auto; }

/* ---------- Reproductor ---------- */
.player { position: fixed; inset: 0; z-index: 20; background: var(--fondo); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.player.oscuro { --fondo: #0b1520; --sup: #13202d; --tinta: #e8eef3; --tenue: #9fb0bf; --linea: #273746; --sup-2: #1c2b3a; --sel: #123a57; --ok-suave: #143322; --malo-suave: #3b1b16; --azul: #3ea4e6; --verde-ok: #43c06a; --malo: #f07862; color-scheme: dark; background: var(--fondo); color: var(--tinta); }
.p-top { padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 8px; display: grid; gap: 8px; max-width: 920px; width: 100%; margin: 0 auto; }
.p-top .fila { display: flex; align-items: center; gap: 12px; }
.p-top .titulo { flex: 1; min-width: 0; font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icono { border: 0; background: var(--sup); box-shadow: var(--sombra); width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.icono svg { width: 18px; height: 18px; }
.segs { display: flex; gap: 3px; }
.segs i { flex: 1; height: 5px; border-radius: 9px; background: var(--linea); overflow: hidden; position: relative; }
.segs i.v::after { content: ""; position: absolute; inset: 0; background: var(--azul); }
.segs i.a::after { content: ""; position: absolute; inset: 0; background: var(--azul); animation: llena .5s ease-out both; transform-origin: left; }
@keyframes llena { from { transform: scaleX(0); } }
.p-cuerpo { overflow-y: auto; overscroll-behavior: contain; }
.paso { max-width: 920px; margin: 0 auto; padding: 12px 16px 28px; display: grid; gap: 16px; align-content: start; min-height: 100%; }
.paso.entra { animation: entra .42s cubic-bezier(.2,.8,.2,1) both; }
.paso.entra-atras { animation: entraAtras .42s cubic-bezier(.2,.8,.2,1) both; }
@keyframes entra { from { opacity: 0; transform: translateX(28px); } }
@keyframes entraAtras { from { opacity: 0; transform: translateX(-28px); } }
.p-pie { padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 12px); border-top: 1px solid var(--linea); background: var(--fondo); }
.p-pie .in { max-width: 920px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.p-pie .cuenta { font-size: 12.5px; color: var(--tenue); font-weight: 600; }

/* Piezas de contenido */
.paso h2 { font-size: clamp(24px, 4.2vw, 34px); }
.paso .lead { font-size: 16.5px; max-width: 62ch; }
.ayuda { font-size: 13px; color: var(--tenue); font-weight: 600; }
.foto-banda { width: 100%; max-height: 300px; object-fit: cover; border-radius: var(--r); background: var(--sup-2); }
.dos-col { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 22px; align-items: start; }
.dos-col .foto-alta { width: 100%; max-height: 460px; object-fit: cover; border-radius: var(--r); background: var(--sup-2); }
.pila { display: grid; gap: 14px; align-content: start; min-width: 0; }
.lista { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.lista li { position: relative; padding-left: 22px; }
.lista li::before { content: ""; position: absolute; left: 2px; top: .42em; width: 11px; height: 10px; background: var(--verde-ok); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.bloques { display: grid; gap: 10px; }
.bloque { background: var(--sup); border-radius: 12px; padding: 12px 14px; box-shadow: var(--sombra); }
.bloque b { display: block; font-family: var(--display); font-style: italic; font-size: 17px; color: var(--azul); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.col { background: var(--sup); border-radius: 12px; padding: 14px; box-shadow: var(--sombra); display: grid; gap: 8px; align-content: start; }
.col h3 { font-size: 16px; color: var(--azul); }
.grande { font-family: var(--display); font-style: italic; font-weight: 800; font-size: clamp(20px, 3.4vw, 26px); line-height: 1.2; color: var(--azul); border-left: 5px solid var(--verde); padding: 4px 0 4px 14px; text-wrap: balance; }
.dato { display: flex; align-items: center; gap: 14px; background: var(--azul-hondo); color: #eaf4fb; border-radius: var(--r); padding: 14px 18px; }
.dato b { font-family: var(--display); font-style: italic; font-size: 40px; line-height: 1; color: #fff; white-space: nowrap; }
.dato b small { font-size: 15px; margin-left: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--sup); border: 1px solid var(--linea); border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 600; }
.nota { font-size: 13px; color: var(--tenue); background: var(--sup-2); border-radius: 10px; padding: 10px 12px; }

/* Intro */
.intro { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 18px; align-items: center; min-height: 100%; }
.intro h2 { font-size: clamp(28px, 5vw, 44px); }
.intro .lead { margin-top: 12px; }
.intro .rino { width: 210px; animation: flota 3.4s ease-in-out infinite; filter: drop-shadow(0 12px 14px rgba(6,47,77,.18)); }
.intro .logo-mod { height: 54px; width: auto; margin-bottom: 14px; border-radius: 10px; }
@keyframes flota { 50% { transform: translateY(-8px) rotate(-1deg); } }
.revela { margin-top: 18px; }
.revela .resp { margin-top: 12px; font-family: var(--display); font-style: italic; font-weight: 800; font-size: 26px; color: var(--azul); animation: entra .4s both; }

/* Cifras */
.cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 12px; }
.cifra { background: var(--sup); border-radius: var(--r); padding: 16px; box-shadow: var(--sombra); display: grid; gap: 2px; }
.cifra b { font-family: var(--display); font-style: italic; font-weight: 900; font-size: clamp(30px, 5vw, 44px); line-height: 1; color: var(--azul); font-variant-numeric: tabular-nums; }
.cifra b small { font-size: .42em; font-weight: 800; margin-left: 4px; color: var(--tinta); }
.cifra > span { font-size: 13px; color: var(--tenue); }

/* Revelar puntos */
.puntos { display: grid; gap: 8px; }
.punto { display: flex; align-items: center; gap: 12px; background: var(--sup); border-radius: 12px; padding: 12px 14px; box-shadow: var(--sombra); animation: entra .35s both; }
.punto .tri { width: 14px; height: 13px; background: var(--verde); clip-path: polygon(50% 0, 100% 100%, 0 100%); flex: none; }
.puntos.grandes .punto { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 22px; }
.oculto-punto { border: 2px dashed var(--linea); border-radius: 12px; padding: 12px 14px; color: var(--tenue); font-weight: 600; background: transparent; text-align: left; }

/* Escalera */
.escalera { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: e; }
.escalera li { position: relative; padding: 0 0 18px 52px; animation: entra .45s both; }
.escalera li::before { counter-increment: e; content: counter(e); position: absolute; left: 0; top: 0; width: 36px; height: 36px; border-radius: 50%; background: var(--azul); color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-style: italic; }
.escalera li::after { content: ""; position: absolute; left: 17px; top: 38px; bottom: 2px; width: 2px; background: var(--linea); }
.escalera li:last-child::after { display: none; }
.escalera b { display: block; font-family: var(--display); font-style: italic; font-size: 18px; line-height: 1.2; padding-top: 6px; }
.escalera span { color: var(--tenue); }

/* Voltear */
.voltea { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 12px; }
.carta { perspective: 900px; border: 0; padding: 0; background: none; min-height: 150px; text-align: left; }
.carta .in { display: block; position: relative; height: 100%; min-height: 150px; transition: transform .6s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
.carta.v .in { transform: rotateY(180deg); }
.carta .cara { display: grid; position: absolute; inset: 0; border-radius: var(--r); padding: 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; align-content: center; box-shadow: var(--sombra); }
.carta .frente { background: var(--azul); color: #fff; font-family: var(--display); font-style: italic; font-weight: 800; font-size: 21px; line-height: 1.15; }
.carta .frente::after { content: "Toca para voltear"; position: absolute; bottom: 10px; left: 16px; font-family: var(--texto); font-style: normal; font-size: 11px; font-weight: 600; opacity: .75; }
.carta .reverso { background: var(--sup); transform: rotateY(180deg); font-size: 14.5px; }

/* Comparar */
.compara { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.lado { background: var(--sup); border-radius: var(--r); padding: 16px; box-shadow: var(--sombra); display: grid; gap: 10px; align-content: start; border-top: 5px solid var(--azul); }
.lado.mal { border-top-color: var(--malo); }
.lado.bien { border-top-color: var(--verde-ok); }
.lado h3 { font-size: 18px; }
.lado.mal .lista li::before { background: var(--malo); clip-path: polygon(20% 0, 50% 30%, 80% 0, 100% 20%, 70% 50%, 100% 80%, 80% 100%, 50% 70%, 20% 100%, 0 80%, 30% 50%, 0 20%); }
.par-img { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.par-img img { width: 100%; height: 220px; object-fit: cover; border-radius: var(--r); background: var(--sup-2); }

/* Tabla */
.tabla-caja { overflow-x: auto; background: var(--sup); border-radius: var(--r); box-shadow: var(--sombra); }
.tabla-caja table { border-collapse: collapse; font-size: 13px; min-width: 640px; width: 100%; }
.tabla-caja th { background: var(--azul); color: #fff; text-align: left; padding: 9px 10px; font-size: 11.5px; letter-spacing: .04em; white-space: nowrap; }
.tabla-caja td { padding: 9px 10px; border-bottom: 1px solid var(--linea); vertical-align: top; }
.tabla-caja tr.dest td { background: var(--ok-suave); font-weight: 700; }
.tabla-caja.fija td:first-child, .tabla-caja.fija th:first-child { position: sticky; left: 0; background: var(--sup); font-weight: 700; z-index: 1; }
.tabla-caja.fija th:first-child { background: var(--azul); }

/* Productos */
.productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 12px; }
.prod { border: 0; padding: 0; background: var(--sup); border-radius: var(--r); overflow: hidden; box-shadow: var(--sombra); text-align: left; display: grid; transition: transform .2s; }
.prod:hover { transform: translateY(-2px); }

.prod b { font-size: 13.5px; line-height: 1.25; }
.prod span { font-size: 11.5px; color: var(--tenue); font-weight: 600; }
.prod.activo { outline: 3px solid var(--azul); }
.ficha { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 16px; background: var(--sup); border-radius: var(--r); padding: 14px; box-shadow: var(--sombra); animation: entra .35s both; align-items: center; }
.ficha img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 10px; }
.ficha h3 { font-size: 21px; }
.tag { display: inline-block; background: var(--palido); color: var(--verde-ok); border-radius: 99px; padding: 3px 10px; font-size: 12px; font-weight: 700; margin: 6px 0 8px; }

/* Galería y cómic */
.galeria { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.galeria figure { margin: 0; background: var(--sup); border-radius: var(--r); overflow: hidden; box-shadow: var(--sombra); }

.comic img { width: 100%; height: auto; border-radius: var(--r); cursor: zoom-in; box-shadow: 0 10px 30px rgba(0,0,0,.35); animation: zoomin .7s cubic-bezier(.2,.8,.2,1) both; }
@keyframes zoomin { from { transform: scale(.94); opacity: 0; } }
.comic .tx { font-size: 15px; max-width: 70ch; }
.lightbox { position: fixed; inset: 0; z-index: 40; background: rgba(4, 14, 22, .92); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; animation: zoomin .3s both; }

/* Cita */
.cita { position: relative; background: var(--azul-hondo); color: #eaf4fb; border-radius: 18px; padding: 30px 26px 26px; overflow: hidden; }
.cita::before { content: ""; position: absolute; right: -60px; top: -40px; width: 220px; height: 200px; background: #00d200; opacity: .12; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.cita q { display: block; position: relative; font-family: var(--display); font-style: italic; font-weight: 800; font-size: clamp(21px, 3.6vw, 30px); line-height: 1.25; color: #fff; quotes: "“" "”"; text-wrap: balance; }
.cita q.larga { font-size: clamp(17px, 2.6vw, 21px); font-weight: 700; line-height: 1.4; }
.cita cite { display: block; margin-top: 14px; font-style: normal; color: #8fc9ee; font-weight: 700; }
.cita-img { width: 100%; max-height: 300px; object-fit: contain; border-radius: var(--r); background: #fff; }

/* Logos y sucursales */
.logos { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 130px), 1fr)); gap: 10px; }
.logos div { background: #fff; border-radius: 12px; padding: 14px; display: grid; place-items: center; height: 92px; box-shadow: var(--sombra); }
.logos img { max-width: 100%; max-height: 60px; object-fit: contain; }
.sucs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px; }
.suc { background: var(--sup); border-radius: var(--r); padding: 16px; box-shadow: var(--sombra); border-top: 5px solid var(--azul); }
.suc b { font-family: var(--display); font-style: italic; font-size: 19px; display: block; margin-bottom: 6px; }
.suc span { font-size: 13.5px; color: var(--tenue); }

/* Cocina */
.cocina { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 18px; align-items: center; }
.cocina svg { width: 100%; height: auto; }
.cocina .zona { cursor: pointer; transition: filter .2s; }
.cocina .zona:hover, .cocina .zona.on { filter: brightness(1.08) drop-shadow(0 0 6px rgba(0,121,193,.6)); }
.brillo { animation: brillo 3.2s ease-in-out infinite; }
@keyframes brillo { 0% { transform: translateX(-120px); } 60%, 100% { transform: translateX(520px); } }
.zona-info { background: var(--sup); border-radius: var(--r); padding: 16px; box-shadow: var(--sombra); display: grid; gap: 6px; min-height: 120px; align-content: center; }
.zona-info b { font-family: var(--display); font-style: italic; font-size: 22px; color: var(--azul); }

/* Barras y dona */
.barras { display: grid; gap: 10px; background: var(--sup); border-radius: var(--r); padding: 18px; box-shadow: var(--sombra); }
.barra { display: grid; grid-template-columns: 130px minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: 13.5px; }
.barra .riel2 { height: 22px; background: var(--sup-2); border-radius: 6px; overflow: hidden; }
.barra .riel2 i { display: block; height: 100%; background: var(--azul); border-radius: 6px; transform-origin: left; animation: crece 1s cubic-bezier(.2,.8,.2,1) both; }
.barra:first-child .riel2 i { background: var(--verde-ok); }
.barra .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
@keyframes crece { from { transform: scaleX(0); } }
.dona { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 22px; align-items: center; }
.dona svg { width: 220px; max-width: 100%; height: auto; }
.dona circle.seg { transition: stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1); }
.leyenda { display: grid; gap: 10px; }
.leyenda div { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.leyenda i { width: 14px; height: 14px; border-radius: 4px; }
.leyenda b { font-variant-numeric: tabular-nums; }

/* Nube */
.nube { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.palabra { border: 1.5px solid var(--linea); background: var(--sup); border-radius: 10px; padding: 6px 12px; font-family: var(--display); font-style: italic; font-weight: 800; font-size: 18px; color: var(--tenue); transition: all .3s cubic-bezier(.3,1.5,.5,1); }
.palabra.on { background: var(--verde-ok); border-color: var(--verde-ok); color: #fff; transform: scale(1.12) rotate(-2deg); }
.palabra.conf.on { background: var(--azul); border-color: var(--azul); }

/* Respirar */
.respira { display: grid; place-items: center; gap: 18px; padding: 10px 0; }
.circulo { width: 200px; height: 200px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #7fe07f, #1e8e3e); color: #fff; font-family: var(--display); font-style: italic; font-weight: 800; font-size: 22px; transform: scale(.6); transition: transform 4s ease-in-out; box-shadow: 0 0 0 14px rgba(30,142,62,.12), 0 0 0 30px rgba(30,142,62,.06); text-align: center; }
.circulo.in { transform: scale(1); }

/* Preguntas */
.pregunta { display: grid; gap: 14px; }
.pregunta .q { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 14px; align-items: center; }
.pregunta .q h2 { font-size: clamp(21px, 3.6vw, 28px); }
.pregunta .q img { width: 96px; }
.ops { display: grid; gap: 10px; }
.op { border: 1.5px solid var(--linea); background: var(--sup); border-radius: 12px; padding: 14px 16px; text-align: left; font-weight: 600; display: flex; align-items: center; gap: 12px; transition: border-color .2s, background .2s, transform .15s; }
.op:hover:not([disabled]) { border-color: var(--azul); }
.op .letra { width: 28px; height: 28px; flex: none; border-radius: 8px; background: var(--sup-2); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.op[disabled] { cursor: default; }
.op.bien { border-color: var(--verde-ok); background: var(--ok-suave); }
.op.bien .letra { background: var(--verde-ok); color: #fff; }
.op.mal { border-color: var(--malo); background: var(--malo-suave); }
.op.mal .letra { background: var(--malo); color: #fff; }
.vf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.vf .op { justify-content: center; font-size: 17px; padding: 18px; }
.retro { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 12px; align-items: center; border-radius: var(--r); padding: 12px 14px; animation: entra .35s both; }
.retro.bien { background: var(--ok-suave); }
.retro.mal { background: var(--malo-suave); }
.retro img { width: 74px; }
.retro b { font-family: var(--display); font-style: italic; font-size: 20px; display: block; }
.retro.bien b { color: var(--verde-ok); }
.retro.mal b { color: var(--malo); }
.sacude { animation: sacude .4s; }
@keyframes sacude { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* Relacionar, ordenar, clasificar */
.relaciona { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.relaciona .colr { display: grid; gap: 10px; align-content: start; }
.ficha-r { border: 1.5px solid var(--linea); background: var(--sup); border-radius: 12px; padding: 12px; font-weight: 600; font-size: 14px; text-align: left; min-height: 52px; transition: all .2s; }
.ficha-r.sel { border-color: var(--azul); background: var(--sel); }
.ficha-r.hecha { border-color: var(--verde-ok); background: var(--ok-suave); color: var(--verde-ok); cursor: default; }
.ficha-r .par-n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--verde-ok); color: #fff; font-size: 11px; margin-right: 6px; }
.ordena { display: grid; gap: 14px; }
.ordenados { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: o; }
.ordenados li { counter-increment: o; display: flex; gap: 12px; align-items: center; background: var(--ok-suave); border-radius: 12px; padding: 11px 14px; font-weight: 600; animation: entra .3s both; }
.ordenados li::before { content: counter(o); width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--verde-ok); color: #fff; display: grid; place-items: center; font-family: var(--display); font-style: italic; font-weight: 800; }
.ordenados li.hueco { background: transparent; border: 2px dashed var(--linea); color: var(--tenue); }
.ordenados li.hueco::before { background: var(--linea); }
.pool { display: flex; flex-wrap: wrap; gap: 8px; }
.pool .ficha-r { flex: 1 1 auto; min-height: 0; }
.grupos { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 104px), 1fr)); gap: 8px; }
.grupo { border: 2px dashed var(--linea); border-radius: var(--r); padding: 12px; min-height: 110px; display: grid; gap: 8px; align-content: start; background: transparent; text-align: left; transition: border-color .2s, background .2s; }
.grupo.listo { border-color: var(--azul); background: var(--sel); }
.grupo > b { font-family: var(--display); font-style: italic; font-size: 16px; }
.grupo .ficha-r { font-size: 13px; padding: 8px 10px; min-height: 0; }
.sigla { display: flex; gap: 8px; }
.sigla span { width: 48px; height: 52px; border-radius: 10px; display: grid; place-items: center; font-family: var(--display); font-style: italic; font-weight: 900; font-size: 28px; background: var(--sup-2); color: var(--tenue); transition: all .4s cubic-bezier(.3,1.5,.5,1); }
.sigla span.on { background: var(--azul); color: #fff; transform: translateY(-4px); }

/* Ranking y reflexión */
.rank-items { display: flex; flex-wrap: wrap; gap: 8px; }
textarea { width: 100%; min-height: 140px; font: inherit; padding: 14px; border-radius: 12px; border: 1.5px solid var(--linea); background: var(--sup); color: var(--tinta); resize: vertical; }

/* Tarjetero de gestos */
.tarjetero { display: grid; gap: 12px; }
.tj { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: center; background: var(--sup); border-radius: var(--r); padding: 14px; box-shadow: var(--sombra); animation: entra .35s both; }
.tj img { width: 100%; border-radius: 10px; background: #fff; }
.tj h3 { font-size: 21px; margin-bottom: 8px; }
.tj-nav { display: flex; justify-content: center; align-items: center; gap: 14px; font-weight: 700; }
.gesto-img { width: 100%; max-width: 360px; border-radius: var(--r); animation: zoomin .5s both; background: #fff; }

/* Resultado */
.resultado { text-align: center; display: grid; justify-items: center; gap: 12px; padding-top: 10px; }
.resultado .rino { width: 170px; animation: salta 1s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes salta { from { transform: translateY(40px) scale(.8); opacity: 0; } }
.resultado .marcador { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.resultado .marcador div { background: var(--sup); border-radius: var(--r); padding: 14px 20px; box-shadow: var(--sombra); min-width: 130px; }
.resultado .marcador b { display: block; font-family: var(--display); font-style: italic; font-weight: 900; font-size: 36px; color: var(--azul); font-variant-numeric: tabular-nums; }
.resultado .marcador span { font-size: 12.5px; color: var(--tenue); font-weight: 600; }
.resultado .acciones { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
#confeti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

/* Certificado */
.cert-img { width: 100%; max-width: 820px; border-radius: 10px; box-shadow: var(--sombra); background: #fff; }

.solo-oscuro { display: none; }

@media (max-width: 720px) {
  .banda-in { grid-template-columns: 1fr; }
  .estiba-caja { flex-direction: row; justify-content: flex-start; }
  .estiba { width: 150px; }
  .dos-col, .cocina, .dona { grid-template-columns: 1fr; }
  .intro { grid-template-columns: 1fr; text-align: left; }
  .intro .rino { width: 150px; justify-self: center; grid-row: 1; }
  .compara, .par-img { grid-template-columns: 1fr; }
  .ficha { grid-template-columns: 110px minmax(0, 1fr); }
  .tj { grid-template-columns: 1fr; }
  .barra { grid-template-columns: 100px minmax(0, 1fr) 52px; }
  .relaciona { grid-template-columns: 1fr 1fr; gap: 8px; }
  .ficha-r { font-size: 13px; padding: 10px; }
  .alta .dos { grid-template-columns: 1fr; }
  .mod { grid-template-columns: 84px minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
